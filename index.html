<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Runner PRO: Infinite Sector</title>
  <link rel="manifest" href="manifest.json">
  <!-- MOTOR GRÁFICO PROFESIONAL PHASER 3 Y FUENTES -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; touch-action: none; user-select: none; }
    body { margin: 0; padding: 0; background: #020208; overflow: hidden; font-family: 'Rajdhani', sans-serif; color: #fff; }
    #game-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    
    /* INTERFAZ UI FLOTANTE SOBRE EL MOTOR */
    .ui-layer {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 10; display: flex; flex-direction: column;
      justify-content: space-between; padding: 20px; box-sizing: border-box;
    }

    .top-hud { display: flex; justify-content: space-between; align-items: center; }
    .hud-box {
      background: rgba(8, 15, 30, 0.85); border: 2px solid #00f0ff;
      padding: 8px 16px; border-radius: 12px; font-family: 'Orbitron', sans-serif;
      font-size: 16px; color: #00f0ff; box-shadow: 0 0 15px rgba(0,240,255,0.4);
    }

    /* PANTALLAS DE MENÚ PROFESIONALES */
    .overlay-screen {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(2, 2, 8, 0.92); backdrop-filter: blur(10px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 20; padding: 20px; text-align: center;
    }

    .game-title {
      font-family: 'Orbitron', sans-serif; font-size: 36px; font-weight: 900;
      color: #00f0ff; text-shadow: 0 0 20px #00f0ff, 0 0 40px #ff007f;
      margin-bottom: 5px; letter-spacing: 2px;
    }

    .subtitle { color: #94a3b8; font-size: 16px; font-weight: 700; margin-bottom: 25px; }

    .btn-play {
      background: linear-gradient(45deg, #ff007f, #7928ca);
      color: #fff; border: none; padding: 18px 50px; border-radius: 40px;
      font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 900;
      cursor: pointer; box-shadow: 0 0 30px #ff007f; transition: transform 0.1s;
      pointer-events: auto; letter-spacing: 1px;
    }
    .btn-play:active { transform: scale(0.92); }

    .character-select {
      display: flex; gap: 12px; margin-bottom: 25px; pointer-events: auto;
    }
    .char-btn {
      background: #0f172a; border: 2px solid #334155; border-radius: 14px;
      padding: 10px; width: 85px; cursor: pointer; transition: all 0.2s;
    }
    .char-btn.active {
      border-color: #ff007f; background: #1e1b4b; box-shadow: 0 0 20px #ff007f;
      transform: scale(1.08);
    }
    .char-btn img { width: 45px; height: 45px; display: block; margin: 0 auto; }
    .char-btn span { font-size: 11px; font-family: 'Orbitron', sans-serif; margin-top: 5px; display: block; }
  </style>
</head>
<body>

  <div id="game-container"></div>

  <!-- CAPA DE INTERFAZ -->
  <div class="ui-layer" id="game-hud" style="display: none;">
    <div class="top-hud">
      <div class="hud-box">SECTOR: <span id="hud-level">1</span></div>
      <div class="hud-box" style="color: #ff007f; border-color: #ff007f;">❤️ <span id="hud-lives">3</span></div>
      <div class="hud-box" style="color: #00ff66; border-color: #00ff66;">💎 <span id="hud-score">0</span></div>
    </div>
  </div>

  <!-- PORTADA DE INICIO -->
  <div class="overlay-screen" id="main-menu">
    <div class="game-title">CYBER RUNNER PRO</div>
    <div class="subtitle">EDICIÓN MOTOR GRÁFICO HÍBRIDO</div>

    <div class="subtitle" style="color: #00f0ff; margin-bottom: 10px;">SELECCIONA TU CÁPSULA:</div>
    <div class="character-select">
      <div class="char-btn active" id="btn-cat" onclick="setHero('cat')">
        <span>CYBER CAT</span>
      </div>
      <div class="char-btn" id="btn-fox" onclick="setHero('fox')">
        <span>NEON FOX</span>
      </div>
      <div class="char-btn" id="btn-bunny" onclick="setHero('bunny')">
        <span>MECHA BUNNY</span>
      </div>
    </div>

    <button class="btn-play" onclick="launchGame()">¡DESPEGAR!</button>
  </div>

  <!-- PANTALLA GAME OVER -->
  <div class="overlay-screen" id="game-over-screen" style="display: none;">
    <div class="game-title" style="color: #ff007f; text-shadow: 0 0 20px #ff007f;">💥 MISIÓN FALLIDA</div>
    <div class="subtitle">Llegaste al Sector <span id="final-level">1</span> con <span id="final-score">0</span> gemas.</div>
    <button class="btn-play" onclick="restartGame()">REINTENTAR</button>
  </div>

  <script>
    let selectedHero = 'cat';
    let currentGame = null;

    function setHero(type) {
      selectedHero = type;
      document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${type}`).classList.add('active');
    }

    function launchGame() {
      document.getElementById('main-menu').style.display = 'none';
      document.getElementById('game-hud').style.display = 'flex';

      if (!currentGame) {
        initPhaserEngine();
      } else {
        currentGame.scene.scenes[0].scene.restart();
      }
    }

    function restartGame() {
      document.getElementById('game-over-screen').style.display = 'none';
      document.getElementById('game-hud').style.display = 'flex';
      currentGame.scene.scenes[0].scene.restart();
    }

    // CONFIGURACIÓN Y LÓGICA DEL MOTOR PHASER 3
    function initPhaserEngine() {
      const config = {
        type: Phaser.AUTO,
        parent: 'game-container',
        width: window.innerWidth,
        height: window.innerHeight,
        physics: {
          default: 'arcade',
          arcade: { gravity: { y: 0 }, debug: false }
        },
        scene: { preload: preload, create: create, update: update }
      };

      currentGame = new Phaser.Game(config);

      let player, enemies, gems, score = 0, lives = 3, currentSector = 1, targetScore = 30;

      function preload() {
        // Texturas generadas en tiempo de ejecución para asegurar carga instantánea HD
        let g = this.add.graphics();
        
        // Player Cat (Cian)
        g.fillStyle(0x00f0ff, 1); g.fillCircle(20, 20, 18);
        g.lineStyle(3, 0xffffff); g.strokeCircle(20, 20, 18);
        g.generateTexture('hero_cat', 40, 40); g.clear();

        // Player Fox (Dorado)
        g.fillStyle(0xfacc15, 1); g.fillCircle(20, 20, 18);
        g.lineStyle(3, 0xffffff); g.strokeCircle(20, 20, 18);
        g.generateTexture('hero_fox', 40, 40); g.clear();

        // Player Bunny (Magenta)
        g.fillStyle(0xff007f, 1); g.fillCircle(20, 20, 18);
        g.lineStyle(3, 0xffffff); g.strokeCircle(20, 20, 18);
        g.generateTexture('hero_bunny', 40, 40); g.clear();

        // Obstáculo Mina de Plasma
        g.fillStyle(0xff0055, 1); g.fillCircle(18, 18, 16);
        g.lineStyle(2, 0xffffff); g.strokeCircle(18, 18, 16);
        g.generateTexture('mine', 36, 36); g.clear();

        // Gema Recolectable
        g.fillStyle(0x00ff66, 1); g.fillRect(4, 4, 16, 16);
        g.generateTexture('gem', 24, 24); g.clear();
      }

      function create() {
        score = 0; lives = 3; currentSector = 1; targetScore = 30;
        updateHUD();

        // Partículas de fondo (Campo Estelar)
        const particles = this.add.particles(0, 0, 'gem', {
          speedY: { min: 100, max: 300 },
          scale: { start: 0.2, end: 0 },
          blendMode: 'ADD',
          lifespan: 2000,
          frequency: 50
        });

        // Jugador con físicas
        const textureKey = `hero_${selectedHero}`;
        player = this.physics.add.sprite(window.innerWidth / 2, window.innerHeight - 100, textureKey);
        player.setCollideWorldBounds(true);

        // Controles táctiles y deslizamiento suave
        this.input.on('pointermove', function (pointer) {
          player.x = Phaser.Math.Linear(player.x, pointer.x, 0.2);
        });

        enemies = this.physics.add.group();
        gems = this.physics.add.group();

        // Temporizadores de generación
        this.time.addEvent({ delay: 600, callback: spawnEnemy, callbackScope: this, loop: true });
        this.time.addEvent({ delay: 1000, callback: spawnGem, callbackScope: this, loop: true });

        // Colisiones
        this.physics.add.overlap(player, gems, collectGem, null, this);
        this.physics.add.overlap(player, enemies, hitEnemy, null, this);
      }

      function update() {
        // Rotación de enemigos y gemas para dinamismo
        enemies.children.iterate(e => { if (e) e.rotation += 0.05; });
        gems.children.iterate(g => { if (g) g.rotation += 0.02; });
      }

      function spawnEnemy() {
        const x = Phaser.Math.Between(30, window.innerWidth - 30);
        const enemy = enemies.create(x, -20, 'mine');
        enemy.setVelocityY(200 + (currentSector * 30));
      }

      function spawnGem() {
        const x = Phaser.Math.Between(30, window.innerWidth - 30);
        const gem = gems.create(x, -20, 'gem');
        gem.setVelocityY(180);
      }

      function collectGem(player, gem) {
        gem.destroy();
        score += 10;

        if (score >= targetScore) {
          currentSector++;
          targetScore += currentSector * 25;
        }

        updateHUD();
      }

      function hitEnemy(player, enemy) {
        enemy.destroy();
        lives--;
        updateHUD();

        // Parpadeo de invulnerabilidad temporal
        this.tweens.add({ targets: player, alpha: 0.2, duration: 100, ease: 'Linear', repeat: 3, yoyo: true });

        if (lives <= 0) {
          document.getElementById('game-hud').style.display = 'none';
          document.getElementById('final-level').innerText = currentSector;
          document.getElementById('final-score').innerText = score;
          document.getElementById('game-over-screen').style.display = 'flex';
          this.scene.pause();
        }
      }

      function updateHUD() {
        document.getElementById('hud-level').innerText = currentSector;
        document.getElementById('hud-lives').innerText = lives;
        document.getElementById('hud-score').innerText = score;
      }
    }
  </script>
</body>
</html>
