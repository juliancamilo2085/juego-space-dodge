<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Blue Strike: Chain Blast 3D</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; touch-action: none; user-select: none; }
    body {
      margin: 0; padding: 0;
      background: linear-gradient(180deg, #001026 0%, #000814 100%);
      font-family: 'Fredoka One', cursive, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      height: 100vh; overflow: hidden; color: #fff;
    }

    /* PORTADA CIBER-ESTADIO 3D */
    .screen {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #002b66 0%, #000d20 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 45px 20px; z-index: 30; box-sizing: border-box;
    }

    .game-logo { font-size: 44px; text-align: center; line-height: 0.95; margin-top: 15px; }
    .logo-top {
      color: #ffffff; text-shadow: 0 6px 0 #004499, 0 10px 30px rgba(0, 136, 255, 0.8);
      display: block; font-size: 48px; letter-spacing: 2px;
    }
    .logo-bottom {
      color: #00d4ff; text-shadow: 0 6px 0 #0055aa, 0 10px 30px rgba(0, 212, 255, 0.8);
      display: block; font-size: 38px; letter-spacing: 3px;
    }

    .badge-card {
      background: rgba(255, 255, 255, 0.95); color: #001a40;
      border-radius: 22px; padding: 16px 28px; width: 100%; max-width: 320px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0, 136, 255, 0.3); margin-bottom: 20px;
      border: 2px solid #00d4ff;
    }
    .badge-info { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 14px; color: #475569; }
    .badge-val { font-size: 26px; color: #003380; font-weight: 900; }

    .menu-buttons { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 320px; margin-bottom: 20px; }
    .btn-menu {
      width: 100%; padding: 18px; border-radius: 24px; border: 2px solid #ffffff;
      font-family: 'Fredoka One', cursive; font-size: 22px; color: #fff;
      cursor: pointer; transition: transform 0.1s; position: relative;
    }
    .btn-menu:active { transform: translateY(4px); }
    .btn-play { background: linear-gradient(180deg, #0088ff, #0044cc); box-shadow: 0 8px 0 #002288, 0 12px 25px rgba(0,136,255,0.5); }

    /* HUD EN JUEGO NEÓN AZUL/BLANCO */
    .game-hud {
      width: 100%; max-width: 420px; padding: 12px 18px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0, 26, 64, 0.9); backdrop-filter: blur(12px);
      border-bottom-left-radius: 22px; border-bottom-right-radius: 22px;
      border: 2px solid #00d4ff; box-shadow: 0 8px 25px rgba(0, 136, 255, 0.4);
    }
    .hud-box {
      background: rgba(255,255,255,0.12); padding: 8px 14px;
      border-radius: 14px; font-size: 16px; display: flex; align-items: center; gap: 6px;
      color: #ffffff; border: 1px solid rgba(255,255,255,0.2);
    }

    /* INSTRUCCIÓN FLOTANTE */
    .speech-bubble {
      background: #ffffff; color: #001a40; padding: 12px 20px; border-radius: 20px;
      font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 14px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4); margin: 15px 0 5px; text-align: center;
      border: 2px solid #00d4ff;
    }

    /* CANCHA CANVAS 3D HD */
    .canvas-container {
      flex: 1; display: flex; justify-content: center; align-items: center;
      width: 100%; position: relative;
    }
    canvas {
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 35px rgba(0, 212, 255, 0.4);
      border: 3px solid #ffffff;
    }

    /* MODALES DE RESULTADO */
    .modal {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 13, 32, 0.9); backdrop-filter: blur(10px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 40;
    }
    .modal-card {
      background: #ffffff; padding: 32px 42px; border-radius: 30px;
      text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.6); max-width: 85%;
      border: 3px solid #0088ff;
    }
    .modal-card h2 { margin: 0 0 10px; font-size: 32px; color: #001a40; }
    .modal-card p { font-size: 16px; color: #475569; margin-bottom: 24px; font-weight: 800; font-family: 'Nunito'; }
    .btn-main {
      background: #0088ff; color: #fff; border: 2px solid #ffffff; padding: 16px 38px;
      border-radius: 30px; font-size: 18px; font-weight: 900; cursor: pointer;
      box-shadow: 0 6px 0 #003399; transition: transform 0.1s;
    }
    .btn-main:active { transform: translateY(3px); }
  </style>
</head>
<body>

  <!-- PORTADA DE INICIO -->
  <div class="screen" id="menuScreen">
    <div class="game-logo">
      <span class="logo-top">BLUE STRIKE</span>
      <span class="logo-bottom">CHAIN BLAST 3D ⚡</span>
    </div>

    <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <div class="badge-card">
        <div class="badge-info">Sector Máximo Alcanzado</div>
        <div class="badge-val">🏆 <span id="maxLvlText">1</span></div>
      </div>

      <div class="menu-buttons">
        <button class="btn-menu btn-play" onclick="startGame()">⚡ DISPARO INICIAL</button>
      </div>
    </div>
  </div>

  <!-- HUD EN JUEGO -->
  <div class="game-hud" id="hud" style="display: none;">
    <div class="hud-box">🏆 SECTOR <span id="lvlText">1</span></div>
    <div class="hud-box" style="color: #ffffff;">⭐ <span id="scoreText">0</span></div>
    <div class="hud-box" style="color: #00d4ff;">⚡ TIROS: <span id="shotsText">3</span></div>
  </div>

  <div class="speech-bubble" id="instruction" style="display: none;">
    ¡Toca un núcleo de energía para desatar la reacción en cadena!
  </div>

  <!-- LIENZO CANCHA 3D HD -->
  <div class="canvas-container" id="canvasBox" style="display: none;">
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- MODALES -->
  <div class="modal" id="winModal" style="display: none;">
    <div class="modal-card">
      <h2 style="color: #0066cc;">🎉 ¡EXPLOSIÓN PERFECTA!</h2>
      <p>Has asegurado el sector con una cadena impecable.</p>
      <button class="btn-main" onclick="nextLevel()">SIGUIENTE SECTOR ➔</button>
    </div>
  </div>

  <div class="modal" id="loseModal" style="display: none;">
    <div class="modal-card">
      <h2 style="color: #cc0044;">💥 SIN CARGAS</h2>
      <p>Se te agotaron las cargas. ¡Inténtalo de nuevo!</p>
      <button class="btn-main" style="background: #cc0044; box-shadow: 0 6px 0 #660022;" onclick="restartLevel()">REINTENTAR</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // PALETA DE NÚCLEOS 3D AZUL & BLANCO
    const ORB_PALETTE = [
      { main: '#0088ff', glow: '#80c8ff', dark: '#004499', isWhite: false, id: 0 }, // Azul Real 3D
      { main: '#ffffff', glow: '#e6f2ff', dark: '#99ccff', isWhite: true,  id: 1 }, // Blanco Nieve 3D
      { main: '#00d4ff', glow: '#b3f0ff', dark: '#007799', isWhite: false, id: 2 }, // Azul Cian 3D
      { main: '#1e3a8a', glow: '#60a5fa', dark: '#0f172a', isWhite: false, id: 3 }  // Azul Noche 3D
    ];

    const GRID_SIZE = 6;
    let cellSize = 50;
    let grid = [];
    let waves = [];
    let particles = [];
    let floatingTexts = [];

    let level = 1;
    let maxLevel = parseInt(localStorage.getItem('blue_strike_max')) || 1;
    let shots = 3;
    let score = 0;
    let isChainActive = false;

    function resizeCanvas() {
      const boxSize = Math.min(window.innerWidth - 30, window.innerHeight - 200);
      canvas.width = boxSize;
      canvas.height = boxSize;
      cellSize = canvas.width / GRID_SIZE;
    }

    function startGame() {
      document.getElementById('menuScreen').style.display = 'none';
      document.getElementById('hud').style.display = 'flex';
      document.getElementById('instruction').style.display = 'block';
      document.getElementById('canvasBox').style.display = 'flex';
      document.getElementById('maxLvlText').innerText = maxLevel;

      resizeCanvas();
      initLevel();
    }

    function initLevel() {
      shots = Math.max(2, 5 - Math.floor(level / 3));
      score = 0;
      isChainActive = false;
      waves = [];
      particles = [];
      floatingTexts = [];

      updateHUD();

      grid = [];
      for (let r = 0; r < GRID_SIZE; r++) {
        grid[r] = [];
        for (let c = 0; c < GRID_SIZE; c++) {
          grid[r][c] = {
            r, c,
            colorIdx: Math.floor(Math.random() * ORB_PALETTE.length),
            active: true,
            pulse: Math.random() * Math.PI,
            scale: 1
          };
        }
      }

      requestAnimationFrame(gameLoop);
    }

    function updateHUD() {
      document.getElementById('lvlText').innerText = level;
      document.getElementById('scoreText').innerText = score;
      document.getElementById('shotsText').innerText = shots;
    }

    function handleCanvasTouch(e) {
      if (isChainActive || shots <= 0) return;

      const rect = canvas.getBoundingClientRect();
      const touchX = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const touchY = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

      const c = Math.floor(touchX / cellSize);
      const r = Math.floor(touchY / cellSize);

      if (r >= 0 && r < GRID_SIZE && c >= 0 && c < GRID_SIZE && grid[r][c].active) {
        shots--;
        updateHUD();
        triggerExplosion(r, c, grid[r][c].colorIdx);
      }
    }

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleCanvasTouch(e); });
    canvas.addEventListener('click', handleCanvasTouch);

    function triggerExplosion(r, c, colorIdx) {
      if (!grid[r][c].active) return;

      grid[r][c].active = false;
      score += 150;
      updateHUD();

      const centerX = c * cellSize + cellSize / 2;
      const centerY = r * cellSize + cellSize / 2;
      const colObj = ORB_PALETTE[colorIdx];

      // Texto Flotante "+150"
      floatingTexts.push({
        x: centerX, y: centerY,
        text: "+150", opacity: 1, vy: -1.5
      });

      // Partículas Neón 3D
      for (let i = 0; i < 20; i++) {
        particles.push({
          x: centerX, y: centerY,
          vx: (Math.random() - 0.5) * 9,
          vy: (Math.random() - 0.5) * 9,
          size: Math.random() * 6 + 3,
          color: colObj.glow,
          life: 1
        });
      }

      // Ondas Expansivas en 4 direcciones
      const directions = [ {dr:-1, dc:0}, {dr:1, dc:0}, {dr:0, dc:-1}, {dr:0, dc:1} ];
      directions.forEach(dir => {
        waves.push({
          r, c,
          dr: dir.dr, dc: dir.dc,
          x: centerX, y: centerY,
          colorIdx: colorIdx,
          speed: 8.5
        });
      });

      isChainActive = true;
    }

    // DIBUJAR ESFERA / NÚCLEO PSEUDO-3D HD
    function drawOrb3D(x, y, radius, colorObj, pulse) {
      ctx.save();
      ctx.translate(x, y);

      let pRadius = radius + Math.sin(pulse) * 2;

      // Sombra Volumétrica en el Suelo
      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.beginPath();
      ctx.ellipse(0, pRadius * 0.8, pRadius * 0.8, pRadius * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();

      // Resplandor Neón de Fondo
      ctx.shadowBlur = 18;
      ctx.shadowColor = colorObj.glow;

      // Gradiente 3D Esférico
      const grad = ctx.createRadialGradient(-pRadius * 0.35, -pRadius * 0.35, 2, 0, 0, pRadius);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.35, colorObj.glow);
      grad.addColorStop(0.85, colorObj.main);
      grad.addColorStop(1, colorObj.dark);

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, pRadius, 0, Math.PI * 2);
      ctx.fill();

      // Anillo de Energía Orbital 3D
      ctx.strokeStyle = colorObj.isWhite ? '#0088ff' : '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, 0, pRadius * 1.15, pRadius * 0.4, pulse * 0.5, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // CANCHA / ESCENARIO CIBERNÉTICO AZUL
      const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      bgGrad.addColorStop(0, '#001a40');
      bgGrad.addColorStop(1, '#000d20');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Rejilla Ciber-Estadio
      ctx.strokeStyle = 'rgba(0, 212, 255, 0.15)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * cellSize, 0); ctx.lineTo(i * cellSize, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * cellSize); ctx.lineTo(canvas.width, i * cellSize);
        ctx.stroke();
      }

      // DIBUJAR ESFERAS 3D
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const item = grid[r][c];
          if (item.active) {
            item.pulse += 0.05;
            const x = c * cellSize + cellSize / 2;
            const y = r * cellSize + cellSize / 2;
            drawOrb3D(x, y, cellSize * 0.32, ORB_PALETTE[item.colorIdx], item.pulse);
          }
        }
      }

      // ONDAS DE PASES / DISPAROS
      for (let i = waves.length - 1; i >= 0; i--) {
        const w = waves[i];
        w.x += w.dc * w.speed;
        w.y += w.dr * w.speed;

        ctx.save();
        ctx.shadowBlur = 12;
        ctx.shadowColor = ORB_PALETTE[w.colorIdx].glow;
        ctx.fillStyle = ORB_PALETTE[w.colorIdx].glow;
        ctx.beginPath();
        ctx.arc(w.x, w.y, 8, 0, Math.PI * 2);
        ctx.fill();

        // Estela
        ctx.strokeStyle = ORB_PALETTE[w.colorIdx].glow;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(w.x, w.y);
        ctx.lineTo(w.x - w.dc * 15, w.y - w.dr * 15);
        ctx.stroke();
        ctx.restore();

        const targetC = Math.floor(w.x / cellSize);
        const targetR = Math.floor(w.y / cellSize);

        if (targetR >= 0 && targetR < GRID_SIZE && targetC >= 0 && targetC < GRID_SIZE) {
          const targetItem = grid[targetR][targetC];
          if (targetItem.active && targetItem.colorIdx === w.colorIdx) {
            waves.splice(i, 1);
            triggerExplosion(targetR, targetC, w.colorIdx);
            continue;
          }
        }

        if (w.x < 0 || w.x > canvas.width || w.y < 0 || w.y > canvas.height) {
          waves.splice(i, 1);
        }
      }

      // PARTÍCULAS
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.035;
        if (p.life <= 0) { particles.splice(i, 1); continue; }

        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      // TEXTOS FLOTANTES (+150)
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.opacity -= 0.025;
        if (ft.opacity <= 0) { floatingTexts.splice(i, 1); continue; }

        ctx.save();
        ctx.font = '20px "Fredoka One"';
        ctx.fillStyle = `rgba(255, 255, 255, ${ft.opacity})`;
        ctx.shadowColor = '#00d4ff';
        ctx.shadowBlur = 8;
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      }

      // EVALUAR ESTADO
      if (waves.length === 0) {
        isChainActive = false;

        let activeCount = 0;
        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            if (grid[r][c].active) activeCount++;
          }
        }

        if (activeCount === 0) {
          setTimeout(() => { document.getElementById('winModal').style.display = 'flex'; }, 300);
          return;
        } else if (shots <= 0 && !isChainActive) {
          setTimeout(() => { document.getElementById('loseModal').style.display = 'flex'; }, 500);
          return;
        }
      }

      requestAnimationFrame(gameLoop);
    }

    function nextLevel() {
      level++;
      if (level > maxLevel) {
        maxLevel = level;
        localStorage.setItem('blue_strike_max', maxLevel);
      }
      document.getElementById('winModal').style.display = 'none';
      initLevel();
    }

    function restartLevel() {
      document.getElementById('loseModal').style.display = 'none';
      initLevel();
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
