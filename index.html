<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Dodge Game</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; touch-action: none; user-select: none; }
    body { margin: 0; padding: 0; background: #030712; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; color: #fff; text-align: center; }
    #gameCanvas { display: block; margin: 0 auto; width: 100vw; height: 100vh; background: #030712; }
    .ui-overlay { position: absolute; top: 15px; left: 0; width: 100%; display: flex; justify-content: space-around; font-size: 18px; font-weight: 800; text-shadow: 0 0 10px rgba(56,189,248,0.5); pointer-events: none; }
    .score-box { color: #38bdf8; }
    .high-box { color: #f59e0b; }
    .modal { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(3, 7, 18, 0.88); backdrop-filter: blur(8px); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
    .modal h1 { font-size: 36px; color: #38bdf8; text-shadow: 0 0 20px #0284c7; margin-bottom: 10px; }
    .modal p { font-size: 15px; color: #94a3b8; max-width: 80%; margin-bottom: 25px; line-height: 1.5; }
    .btn { background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 15px 35px; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 0 20px rgba(16,185,129,0.5); transition: transform 0.2s; }
    .btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <div class="ui-overlay">
    <div class="score-box">PUNTOS: <span id="score">0</span></div>
    <div class="high-box">MÁX: <span id="highScore">0</span></div>
  </div>

  <div id="startModal" class="modal">
    <h1>🚀 SPACE DODGE HD</h1>
    <p>Desliza para pilotar la nave. ¡Esquiva los meteoritos y recolecta las orbes de energía!</p>
    <button class="btn" onclick="startGame()">¡JUGAR AHORA!</button>
  </div>

  <div id="gameOverModal" class="modal" style="display: none;">
    <h1 style="color: #ef4444; text-shadow: 0 0 20px #b91c1c;">💥 ¡NAVE DESTRUIDA!</h1>
    <p>Puntuación obtenida: <strong id="finalScore" style="color:#fff; font-size: 20px;">0</strong></p>
    <button class="btn" onclick="startGame()">REINTENTAR</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let isPlaying = false;
    let score = 0;
    let highScore = localStorage.getItem('space_high') || 0;
    document.getElementById('highScore').innerText = highScore;

    // Fondo Parallax Estelar
    const starBg = Array.from({length: 60}, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 2 + 0.5
    }));

    // Jugador
    const player = {
      x: canvas.width / 2,
      y: canvas.height - 120,
      size: 22,
      targetX: canvas.width / 2,
      particles: []
    };

    let enemies = [];
    let stars = [];
    let spawnTimer = 0;

    function handleMove(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      player.targetX = clientX;
    }
    window.addEventListener('touchmove', handleMove);
    window.addEventListener('mousemove', handleMove);

    function startGame() {
      document.getElementById('startModal').style.display = 'none';
      document.getElementById('gameOverModal').style.display = 'none';
      player.x = canvas.width / 2;
      player.targetX = canvas.width / 2;
      enemies = [];
      stars = [];
      player.particles = [];
      score = 0;
      document.getElementById('score').innerText = '0';
      isPlaying = true;
      requestAnimationFrame(gameLoop);
    }

    function spawnEnemy() {
      const size = Math.random() * 18 + 18;
      enemies.push({
        x: Math.random() * (canvas.width - size * 2) + size,
        y: -size * 2,
        size: size,
        speed: Math.random() * 3 + 3.5 + (score / 40),
        angle: 0,
        rotSpeed: (Math.random() - 0.5) * 0.05
      });
    }

    function spawnStar() {
      stars.push({
        x: Math.random() * (canvas.width - 40) + 20,
        y: -20,
        size: 12,
        speed: 2.8,
        pulse: 0
      });
    }

    function gameOver() {
      isPlaying = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('space_high', highScore);
        document.getElementById('highScore').innerText = highScore;
      }
      document.getElementById('finalScore').innerText = score;
      document.getElementById('gameOverModal').style.display = 'flex';
    }

    // Dibujar Nave estilizada
    function drawShip(x, y, size) {
      // Estela de fuego
      player.particles.push({ x: x + (Math.random() - 0.5) * 6, y: y + size, size: Math.random() * 6 + 2, life: 1 });
      
      for(let i = player.particles.length - 1; i >= 0; i--) {
        let p = player.particles[i];
        p.y += 3;
        p.life -= 0.05;
        if(p.life <= 0) { player.particles.splice(i, 1); continue; }
        ctx.fillStyle = `rgba(245, 158, 11, ${p.life})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      // Cuerpo de la nave
      ctx.save();
      ctx.translate(x, y);

      // Sombra Neón
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#38bdf8';

      // Alas
      ctx.fillStyle = '#0284c7';
      ctx.beginPath();
      ctx.moveTo(0, -size * 1.3);
      ctx.lineTo(-size * 1.4, size);
      ctx.lineTo(size * 1.4, size);
      ctx.closePath();
      ctx.fill();

      // Fuselaje principal
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.moveTo(0, -size * 1.5);
      ctx.lineTo(-size * 0.7, size * 0.8);
      ctx.lineTo(size * 0.7, size * 0.8);
      ctx.closePath();
      ctx.fill();

      // Cabina
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(0, -size * 0.3, size * 0.35, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // Dibujar Meteorito detallado
    function drawAsteroid(e) {
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(e.angle);

      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ef4444';

      ctx.fillStyle = '#334155';
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.arc(0, 0, e.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Cráteres
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(-e.size * 0.3, -e.size * 0.2, e.size * 0.25, 0, Math.PI * 2);
      ctx.arc(e.size * 0.2, e.size * 0.3, e.size * 0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function gameLoop() {
      if (!isPlaying) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Mover Fondo Parallax
      ctx.fillStyle = '#ffffff';
      starBg.forEach(s => {
        s.y += s.speed;
        if(s.y > canvas.height) s.y = 0;
        ctx.globalAlpha = Math.random() * 0.5 + 0.3;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // Movimiento Suave Jugador
      player.x += (player.targetX - player.x) * 0.22;
      drawShip(player.x, player.y, player.size);

      // Spawns
      spawnTimer++;
      if (spawnTimer % 18 === 0) spawnEnemy();
      if (spawnTimer % 80 === 0) spawnStar();

      // Orbes / Estrellas
      for (let i = stars.length - 1; i >= 0; i--) {
        let s = stars[i];
        s.y += s.speed;
        s.pulse += 0.08;

        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#f59e0b';
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size + Math.sin(s.pulse) * 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Colisión Orbe
        let dist = Math.hypot(player.x - s.x, player.y - s.y);
        if (dist < player.size + s.size) {
          score += 10;
          document.getElementById('score').innerText = score;
          stars.splice(i, 1);
        } else if (s.y > canvas.height + 30) {
          stars.splice(i, 1);
        }
      }

      // Meteoritos
      for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.y += e.speed;
        e.angle += e.rotSpeed;

        drawAsteroid(e);

        // Colisión Meteorito
        let dist = Math.hypot(player.x - e.x, player.y - e.y);
        if (dist < player.size + e.size - 4) {
          gameOver();
          return;
        }

        if (e.y > canvas.height + e.size * 2) {
          score += 1;
          document.getElementById('score').innerText = score;
          enemies.splice(i, 1);
        }
      }

      requestAnimationFrame(gameLoop);
    }

    // Registrar Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
