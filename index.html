<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Blue Strike: Match 3D</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; touch-action: none; user-select: none; }
    body {
      margin: 0; padding: 0;
      background: linear-gradient(180deg, #00122e 0%, #000814 100%);
      font-family: 'Fredoka One', cursive, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      height: 100vh; overflow: hidden; color: #fff;
    }

    /* PORTADA IMPACTANTE (BLUE & WHITE) */
    .screen {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #003380 0%, #000d20 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 45px 20px; z-index: 30; box-sizing: border-box;
    }

    .game-logo { font-size: 42px; text-align: center; line-height: 0.95; margin-top: 15px; }
    .logo-top {
      color: #ffffff; text-shadow: 0 6px 0 #002255, 0 10px 30px rgba(0, 136, 255, 0.8);
      display: block; font-size: 46px; letter-spacing: 2px;
    }
    .logo-bottom {
      color: #00d4ff; text-shadow: 0 6px 0 #004488, 0 10px 30px rgba(0, 212, 255, 0.8);
      display: block; font-size: 38px; letter-spacing: 3px;
    }

    .badge-card {
      background: #ffffff; color: #001a40;
      border-radius: 22px; padding: 16px 28px; width: 100%; max-width: 320px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0, 136, 255, 0.35); margin-bottom: 20px;
      border: 3px solid #00d4ff;
    }
    .badge-info { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 14px; color: #475569; }
    .badge-val { font-size: 26px; color: #003380; font-weight: 900; }

    .menu-buttons { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 320px; margin-bottom: 20px; }
    .btn-menu {
      width: 100%; padding: 18px; border-radius: 24px; border: 2px solid #ffffff;
      font-family: 'Fredoka One', cursive; font-size: 22px; color: #fff;
      cursor: pointer; transition: transform 0.1s; position: relative;
    }
    .btn-menu:active { transform: translateY(4px); }
    .btn-play { background: linear-gradient(180deg, #0088ff, #0044cc); box-shadow: 0 8px 0 #002288, 0 12px 25px rgba(0,136,255,0.5); }

    /* HUD EN JUEGO */
    .game-hud {
      width: 100%; max-width: 420px; padding: 12px 18px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0, 26, 64, 0.92); backdrop-filter: blur(12px);
      border-bottom-left-radius: 22px; border-bottom-right-radius: 22px;
      border: 2px solid #00d4ff; box-shadow: 0 8px 25px rgba(0, 136, 255, 0.4);
    }
    .hud-box {
      background: rgba(255,255,255,0.12); padding: 8px 14px;
      border-radius: 14px; font-size: 15px; display: flex; align-items: center; gap: 6px;
      color: #ffffff; border: 1px solid rgba(255,255,255,0.25);
    }

    /* INSTRUCCIÓN FLOTANTE CLARA */
    .speech-bubble {
      background: #ffffff; color: #001a40; padding: 12px 22px; border-radius: 20px;
      font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4); margin: 15px 0 5px; text-align: center;
      border: 2px solid #00d4ff;
    }

    /* TABLERO DE JUEGO */
    .board-container {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; align-items: center; width: 100%;
    }

    .grid-board {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px;
      background: rgba(0, 20, 50, 0.7); padding: 10px; border-radius: 24px;
      backdrop-filter: blur(10px); border: 3px solid #00d4ff;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 25px rgba(0,212,255,0.3);
    }

    .cell {
      width: 44px; height: 44px; background: rgba(255, 255, 255, 0.08);
      border-radius: 12px; display: flex; justify-content: center; align-items: center;
      cursor: pointer; transition: transform 0.15s, background-color 0.15s;
    }
    .cell.selected { transform: scale(1.18); background: rgba(0, 212, 255, 0.4); border: 2px solid #ffffff; }
    .cell.exploding { transform: scale(0); opacity: 0; transition: transform 0.25s, opacity 0.25s; }
    .cell svg { width: 38px; height: 38px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }

    /* MODALES DE RESULTADO */
    .modal {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 13, 32, 0.92); backdrop-filter: blur(10px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 40;
    }
    .modal-card {
      background: #ffffff; padding: 32px 42px; border-radius: 30px;
      text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.6); max-width: 85%;
      border: 3px solid #0088ff;
    }
    .modal-card h2 { margin: 0 0 10px; font-size: 30px; color: #001a40; }
    .modal-card p { font-size: 16px; color: #475569; margin-bottom: 24px; font-weight: 800; font-family: 'Nunito'; }
    .btn-main {
      background: #0088ff; color: #fff; border: 2px solid #ffffff; padding: 16px 38px;
      border-radius: 30px; font-size: 18px; font-weight: 900; cursor: pointer;
      box-shadow: 0 6px 0 #003399; transition: transform 0.1s;
    }
    .btn-main:active { transform: translateY(3px); }
  </style>
</head>
<body>

  <!-- PORTADA DE INICIO -->
  <div class="screen" id="menuScreen">
    <div class="game-logo">
      <span class="logo-top">BLUE STRIKE</span>
      <span class="logo-bottom">MATCH 3D ⚽</span>
    </div>

    <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <div class="badge-card">
        <div class="badge-info">Nivel Máximo Alcanzado</div>
        <div class="badge-val">🏆 <span id="maxLvlText">1</span></div>
      </div>

      <div class="menu-buttons">
        <button class="btn-menu btn-play" onclick="startGame()">⚽ INICIAR JUEGO</button>
      </div>
    </div>
  </div>

  <!-- HUD EN JUEGO -->
  <div class="game-hud" id="hud" style="display: none;">
    <div class="hud-box">🏆 NIVEL <span id="lvlText">1</span></div>
    <div class="hud-box" style="color: #ffffff;">⭐ <span id="scoreText">0</span> / <span id="goalText">300</span></div>
    <div class="hud-box" style="color: #00d4ff;">🔄 <span id="movesText">20</span></div>
  </div>

  <!-- TABLERO MATCH-3 -->
  <div class="board-container" id="gameBoard" style="display: none;">
    <div class="speech-bubble">
      ¡Toca dos fichas contiguas para intercambiarlas y alinear 3 iguales!
    </div>
    <div class="grid-board" id="grid"></div>
  </div>

  <!-- MODALES DE VICTORIA / DERROTA -->
  <div class="modal" id="winModal" style="display: none;">
    <div class="modal-card">
      <h2 style="color: #0088ff;">🎉 ¡NIVEL COMPLETADO!</h2>
      <p>Has alcanzado la meta del nivel con éxito.</p>
      <button class="btn-main" onclick="nextLevel()">SIGUIENTE NIVEL ➔</button>
    </div>
  </div>

  <div class="modal" id="loseModal" style="display: none;">
    <div class="modal-card">
      <h2 style="color: #cc0044;">💥 SIN MOVIMIENTOS</h2>
      <p>Te quedaste sin movimientos. ¡Inténtalo de nuevo!</p>
      <button class="btn-main" style="background: #cc0044; box-shadow: 0 6px 0 #660022;" onclick="restartLevel()">REINTENTAR</button>
    </div>
  </div>

  <script>
    // FICHAS 3D VECTORIALES (AZUL & BLANCO)
    const ITEMS_3D = [
      // 0: Balón Azul Rey 3D
      `<svg viewBox="0 0 100 100"><defs><radialGradient id="g0" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#ffffff"/><stop offset="40%" stop-color="#0088ff"/><stop offset="100%" stop-color="#002266"/></radialGradient></defs><circle cx="50" cy="50" r="42" fill="url(#g0)" stroke="#ffffff" stroke-width="3"/><polygon points="50,25 65,35 60,52 40,52 35,35" fill="#ffffff" opacity="0.9"/></svg>`,
      // 1: Esfera Blanco Nieve 3D
      `<svg viewBox="0 0 100 100"><defs><radialGradient id="g1" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#ffffff"/><stop offset="60%" stop-color="#e6f2ff"/><stop offset="100%" stop-color="#99ccff"/></radialGradient></defs><circle cx="50" cy="50" r="42" fill="url(#g1)" stroke="#0044aa" stroke-width="3"/><polygon points="50,20 62,45 90,48 68,66 75,93 50,78 25,93 32,66 10,48 38,45" fill="#0088ff"/></svg>`,
      // 2: Cristal Azul Cian 3D
      `<svg viewBox="0 0 100 100"><defs><radialGradient id="g2" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#ffffff"/><stop offset="50%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#005588"/></radialGradient></defs><rect x="18" y="18" width="64" height="64" rx="16" fill="url(#g2)" stroke="#ffffff" stroke-width="3"/><rect x="28" y="28" width="20" height="20" rx="6" fill="#ffffff" opacity="0.6"/></svg>`,
      // 3: Escudo Azul Noche 3D
      `<svg viewBox="0 0 100 100"><defs><radialGradient id="g3" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#80c8ff"/><stop offset="50%" stop-color="#003380"/><stop offset="100%" stop-color="#000d26"/></radialGradient></defs><path d="M50 10 L85 25 L85 60 C85 80, 50 95, 50 95 C50 95, 15 80, 15 60 L15 25 Z" fill="url(#g3)" stroke="#00d4ff" stroke-width="3"/><circle cx="50" cy="50" r="14" fill="#ffffff"/></svg>`
    ];

    const ROWS = 7;
    const COLS = 7;
    let board = [];
    let selectedCell = null;
    let level = 1;
    let maxLevel = parseInt(localStorage.getItem('blue_match_max')) || 1;
    let score = 0;
    let goalScore = 300;
    let moves = 20;
    let isProcessing = false;

    function startGame() {
      document.getElementById('menuScreen').style.display = 'none';
      document.getElementById('hud').style.display = 'flex';
      document.getElementById('gameBoard').style.display = 'flex';
      document.getElementById('maxLvlText').innerText = maxLevel;

      initLevel();
    }

    function initLevel() {
      score = 0;
      moves = Math.max(15, 22 - Math.floor(level / 2));
      goalScore = 250 + (level * 100);
      isProcessing = false;
      selectedCell = null;

      updateHUD();

      // Generar tablero garantizando cero alineaciones iniciales
      do {
        board = [];
        for (let r = 0; r < ROWS; r++) {
          board[r] = [];
          for (let c = 0; c < COLS; c++) {
            board[r][c] = Math.floor(Math.random() * ITEMS_3D.length);
          }
        }
      } while (findMatches().length > 0);

      renderBoard();
    }

    function renderBoard() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.r = r;
          cell.dataset.c = c;
          if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
            cell.classList.add('selected');
          }
          if (board[r][c] !== null) {
            cell.innerHTML = ITEMS_3D[board[r][c]];
          }
          cell.onclick = () => onCellClick(r, c);
          grid.appendChild(cell);
        }
      }
    }

    async function onCellClick(r, c) {
      if (isProcessing) return;

      if (!selectedCell) {
        selectedCell = { r, c };
        renderBoard();
      } else {
        const isAdjacent = Math.abs(selectedCell.r - r) + Math.abs(selectedCell.c - c) === 1;
        if (isAdjacent) {
          isProcessing = true;
          swap(selectedCell.r, selectedCell.c, r, c);
          renderBoard();

          let matches = findMatches();
          if (matches.length > 0) {
            moves--;
            updateHUD();
            await processCascades();
          } else {
            // Revertir si no hace trío
            swap(selectedCell.r, selectedCell.c, r, c);
            renderBoard();
          }
          selectedCell = null;
          isProcessing = false;
        } else {
          selectedCell = { r, c };
          renderBoard();
        }
      }
    }

    function swap(r1, c1, r2, c2) {
      let temp = board[r1][c1];
      board[r1][c1] = board[r2][c2];
      board[r2][c2] = temp;
    }

    function findMatches() {
      let matched = new Set();

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS - 2; c++) {
          let val = board[r][c];
          if (val !== null && val === board[r][c+1] && val === board[r][c+2]) {
            matched.add(`${r},${c}`); matched.add(`${r},${c+1}`); matched.add(`${r},${c+2}`);
          }
        }
      }

      for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS - 2; r++) {
          let val = board[r][c];
          if (val !== null && val === board[r+1][c] && val === board[r+2][c]) {
            matched.add(`${r},${c}`); matched.add(`${r+1},${c}`); matched.add(`${r+2},${c}`);
          }
        }
      }

      return Array.from(matched).map(coord => {
        let [r, c] = coord.split(',').map(Number);
        return { r, c };
      });
    }

    async function processCascades() {
      let matches = findMatches();
      while (matches.length > 0) {
        score += matches.length * 20;
        updateHUD();

        matches.forEach(({ r, c }) => {
          board[r][c] = null;
          const cell = document.querySelector(`[data-r="${r}"][data-c="${c}"]`);
          if (cell) cell.classList.add('exploding');
        });

        await new Promise(res => setTimeout(res, 220));

        // Aplicar gravedad
        for (let c = 0; c < COLS; c++) {
          let emptyRow = ROWS - 1;
          for (let r = ROWS - 1; r >= 0; r--) {
            if (board[r][c] !== null) {
              board[emptyRow][c] = board[r][c];
              if (emptyRow !== r) board[r][c] = null;
              emptyRow--;
            }
          }
          for (let r = emptyRow; r >= 0; r--) {
            board[r][c] = Math.floor(Math.random() * ITEMS_3D.length);
          }
        }

        renderBoard();
        await new Promise(res => setTimeout(res, 180));
        matches = findMatches();
      }

      // Evaluar fin de nivel
      if (score >= goalScore) {
        setTimeout(() => { document.getElementById('winModal').style.display = 'flex'; }, 300);
      } else if (moves <= 0) {
        setTimeout(() => { document.getElementById('loseModal').style.display = 'flex'; }, 300);
      }
    }

    function updateHUD() {
      document.getElementById('lvlText').innerText = level;
      document.getElementById('scoreText').innerText = score;
      document.getElementById('goalText').innerText = goalScore;
      document.getElementById('movesText').innerText = moves;
    }

    function nextLevel() {
      level++;
      if (level > maxLevel) {
        maxLevel = level;
        localStorage.setItem('blue_match_max', maxLevel);
      }
      document.getElementById('winModal').style.display = 'none';
      initLevel();
    }

    function restartLevel() {
      document.getElementById('loseModal').style.display = 'none';
      initLevel();
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
