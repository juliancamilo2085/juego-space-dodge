<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Dodge: Galaxy Map</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; touch-action: none; user-select: none; }
    body { margin: 0; padding: 0; background: #030008; overflow: hidden; font-family: 'Montserrat', system-ui, sans-serif; color: #fff; text-align: center; }
    #gameCanvas { display: block; width: 100vw; height: 100vh; background: #030008; }
    
    .ui-overlay {
      position: absolute; top: 15px; left: 0; width: 100%;
      display: flex; justify-content: space-around;
      font-size: 18px; font-weight: 900; pointer-events: none; z-index: 5;
    }
    .score-box { color: #00f0ff; text-shadow: 0 0 10px #00f0ff; }
    .goal-box { color: #00ff66; text-shadow: 0 0 10px #00ff66; }

    /* PANTALLAS Y MAPA */
    .screen {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(3, 0, 12, 0.95); backdrop-filter: blur(12px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 10; padding: 20px; box-sizing: border-box;
    }
    
    h1 { font-size: 32px; color: #00f0ff; text-shadow: 0 0 20px #00f0ff; margin-bottom: 10px; font-weight: 900; }
    p { font-size: 14px; color: #94a3b8; max-width: 85%; margin-bottom: 20px; }

    /* MAPA DE NIVELES GRID */
    .map-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;
      max-width: 320px; width: 100%; margin-bottom: 20px;
    }
    .level-btn {
      background: #0f172a; border: 2px solid #1e293b; color: #64748b;
      border-radius: 16px; padding: 15px 0; font-size: 18px; font-weight: 900;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: not-allowed; transition: all 0.2s;
    }
    .level-btn.unlocked {
      background: linear-gradient(135deg, #0284c7, #00f0ff);
      border-color: #00f0ff; color: #fff; cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }
    .level-btn.completed {
      background: linear-gradient(135deg, #059669, #00ff66);
      border-color: #00ff66; color: #fff; cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
    }
    .level-btn span { font-size: 10px; font-weight: normal; margin-top: 4px; opacity: 0.9; }

    .btn {
      background: linear-gradient(45deg, #ff007f, #7928ca);
      color: #fff; border: none; padding: 15px 35px; border-radius: 50px;
      font-size: 18px; font-weight: 900; letter-spacing: 1px;
      cursor: pointer; box-shadow: 0 0 20px #ff007f;
    }
    .btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <!-- HUD EN JUEGO -->
  <div class="ui-overlay" id="hud" style="display: none;">
    <div class="score-box">PUNTOS: <span id="score">0</span></div>
    <div class="goal-box">META: <span id="goal">0</span></div>
  </div>

  <!-- PANTALLA MAPA DE NIVELES -->
  <div id="mapScreen" class="screen">
    <h1>🚀 MAPA CÓSMICO</h1>
    <p>Selecciona un sector desbloqueado para iniciar la misión.</p>
    <div class="map-grid" id="mapGrid"></div>
  </div>

  <!-- PANTALLA GANAR NIVEL -->
  <div id="winModal" class="screen" style="display: none;">
    <h1 style="color: #00ff66; text-shadow: 0 0 20px #00ff66;">🎉 ¡NIVEL SUPERADO!</h1>
    <p>Has completado la meta del sector con éxito.</p>
    <button class="btn" onclick="showMap()">VOLVER AL MAPA</button>
  </div>

  <!-- PANTALLA GAME OVER -->
  <div id="gameOverModal" class="screen" style="display: none;">
    <h1 style="color: #ff0055; text-shadow: 0 0 20px #ff0055;">💥 ¡MISIÓN FALLIDA!</h1>
    <p>Tu nave fue destruida antes de alcanzar la meta.</p>
    <button class="btn" onclick="retryLevel()">REINTENTAR</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // CONFIGURACIÓN DE NIVELES (Dificultad Escalada)
    const LEVELS = [
      { level: 1, goal: 30, speed: 3.0, spawnRate: 25 },
      { level: 2, goal: 50, speed: 3.5, spawnRate: 22 },
      { level: 3, goal: 80, speed: 4.0, spawnRate: 20 },
      { level: 4, goal: 120, speed: 4.5, spawnRate: 18 },
      { level: 5, goal: 160, speed: 5.0, spawnRate: 16 },
      { level: 6, goal: 200, speed: 5.5, spawnRate: 14 },
      { level: 7, goal: 250, speed: 6.0, spawnRate: 12 },
      { level: 8, goal: 300, speed: 6.5, spawnRate: 10 },
      { level: 9, goal: 400, speed: 7.0, spawnRate: 9 },
      { level: 10, goal: 500, speed: 8.0, spawnRate: 8 }
    ];

    let currentLevelIdx = 0;
    let unlockedLevel = parseInt(localStorage.getItem('space_unlocked_lvl')) || 1;
    let isPlaying = false;
    let score = 0;

    // Fondo Parallax Estelar
    const starsBg = Array.from({length: 70}, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 2 + 0.8,
      speed: Math.random() * 3 + 1,
      color: Math.random() > 0.5 ? '#00f0ff' : '#ff007f'
    }));

    const player = {
      x: canvas.width / 2,
      y: canvas.height - 120,
      size: 22,
      targetX: canvas.width / 2,
      particles: []
    };

    let enemies = [];
    let gems = [];
    let spawnTimer = 0;

    function renderMap() {
      const grid = document.getElementById('mapGrid');
      grid.innerHTML = '';

      LEVELS.forEach((lvlObj, idx) => {
        const lvlNum = idx + 1;
        const btn = document.createElement('div');
        btn.className = 'level-btn';

        if (lvlNum < unlockedLevel) {
          btn.classList.add('completed');
          btn.innerHTML = `NIVEL ${lvlNum} <span>✔ COMPLETADO</span>`;
          btn.onclick = () => startLevel(idx);
        } else if (lvlNum === unlockedLevel) {
          btn.classList.add('unlocked');
          btn.innerHTML = `NIVEL ${lvlNum} <span>META: ${lvlObj.goal}</span>`;
          btn.onclick = () => startLevel(idx);
        } else {
          btn.innerHTML = `🔒 <span>BLOQUEADO</span>`;
        }

        grid.appendChild(btn);
      });
    }

    function showMap() {
      document.getElementById('mapScreen').style.display = 'flex';
      document.getElementById('winModal').style.display = 'none';
      document.getElementById('gameOverModal').style.display = 'none';
      document.getElementById('hud').style.display = 'none';
      isPlaying = false;
      renderMap();
    }

    function startLevel(idx) {
      currentLevelIdx = idx;
      score = 0;
      enemies = [];
      gems = [];
      player.particles = [];
      player.x = canvas.width / 2;
      player.targetX = canvas.width / 2;

      document.getElementById('mapScreen').style.display = 'none';
      document.getElementById('winModal').style.display = 'none';
      document.getElementById('gameOverModal').style.display = 'none';
      document.getElementById('hud').style.display = 'flex';

      document.getElementById('score').innerText = '0';
      document.getElementById('goal').innerText = LEVELS[idx].goal;

      isPlaying = true;
      requestAnimationFrame(gameLoop);
    }

    function retryLevel() {
      startLevel(currentLevelIdx);
    }

    function handleMove(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      player.targetX = clientX;
    }
    window.addEventListener('touchmove', handleMove);
    window.addEventListener('mousemove', handleMove);

    function completeLevel() {
      isPlaying = false;
      if (currentLevelIdx + 2 > unlockedLevel) {
        unlockedLevel = currentLevelIdx + 2;
        localStorage.setItem('space_unlocked_lvl', unlockedLevel);
      }
      document.getElementById('winModal').style.display = 'flex';
    }

    function gameOver() {
      isPlaying = false;
      document.getElementById('gameOverModal').style.display = 'flex';
    }

    function spawnEnemy() {
      const cfg = LEVELS[currentLevelIdx];
      const size = Math.random() * 18 + 18;
      enemies.push({
        x: Math.random() * (canvas.width - size * 2) + size,
        y: -size * 2,
        size: size,
        speed: Math.random() * 2 + cfg.speed,
        rot: 0,
        rotSpeed: (Math.random() - 0.5) * 0.08
      });
    }

    function spawnGem() {
      gems.push({
        x: Math.random() * (canvas.width - 40) + 20,
        y: -20,
        size: 14,
        speed: 3.0,
        pulse: 0
      });
    }

    function gameLoop() {
      if (!isPlaying) return;

      const cfg = LEVELS[currentLevelIdx];

      ctx.fillStyle = 'rgba(3, 0, 8, 0.35)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Estrellas Parallax
      starsBg.forEach(s => {
        s.y += s.speed;
        if (s.y > canvas.height) s.y = 0;
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Nave
      player.x += (player.targetX - player.x) * 0.25;

      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00f0ff';

      ctx.fillStyle = '#ff007f';
      ctx.beginPath();
      ctx.moveTo(0, -player.size * 1.4);
      ctx.lineTo(-player.size * 1.4, player.size);
      ctx.lineTo(player.size * 1.4, player.size);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#00f0ff';
      ctx.beginPath();
      ctx.moveTo(0, -player.size * 1.5);
      ctx.lineTo(-player.size * 0.6, player.size * 0.8);
      ctx.lineTo(player.size * 0.6, player.size * 0.8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // Generación
      spawnTimer++;
      if (spawnTimer % cfg.spawnRate === 0) spawnEnemy();
      if (spawnTimer % 80 === 0) spawnGem();

      // Gemas
      for (let i = gems.length - 1; i >= 0; i--) {
        let g = gems[i];
        g.y += g.speed;
        g.pulse += 0.1;

        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00ff66';
        ctx.fillStyle = '#00ff66';
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.size + Math.sin(g.pulse) * 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        let dist = Math.hypot(player.x - g.x, player.y - g.y);
        if (dist < player.size + g.size) {
          score += 15;
          document.getElementById('score').innerText = score;
          gems.splice(i, 1);

          if (score >= cfg.goal) {
            completeLevel();
            return;
          }
        } else if (g.y > canvas.height + 30) {
          gems.splice(i, 1);
        }
      }

      // Enemigos
      for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.y += e.speed;
        e.rot += e.rotSpeed;

        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.rot);
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ff0055';

        let grad = ctx.createRadialGradient(0, 0, 2, 0, 0, e.size);
        grad.addColorStop(0, '#ff5500');
        grad.addColorStop(1, '#ff0055');
        ctx.fillStyle = grad;

        ctx.beginPath();
        ctx.arc(0, 0, e.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        let dist = Math.hypot(player.x - e.x, player.y - e.y);
        if (dist < player.size + e.size - 4) {
          gameOver();
          return;
        }

        if (e.y > canvas.height + e.size * 2) {
          score += 1;
          document.getElementById('score').innerText = score;
          enemies.splice(i, 1);

          if (score >= cfg.goal) {
            completeLevel();
            return;
          }
        }
      }

      requestAnimationFrame(gameLoop);
    }

    // Inicializar Mapa
    showMap();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
