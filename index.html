<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Blue Strike: Match 3D Saga</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; touch-action: none; user-select: none; }
    body {
      margin: 0; padding: 0;
      background: #000d20;
      font-family: 'Fredoka One', cursive, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      height: 100vh; overflow: hidden; color: #fff;
    }

    /* PANTALLA PRINCIPAL CON PERSONAJE */
    .screen {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #003380 0%, #000d20 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 30px 20px; z-index: 30; box-sizing: border-box;
    }

    /* BARRA SUPERIOR */
    .top-navbar {
      width: 100%; max-width: 420px; display: flex;
      justify-content: space-between; align-items: center; z-index: 35;
    }
    .hud-pill {
      background: rgba(255, 255, 255, 0.95); color: #001a40;
      border-radius: 20px; padding: 6px 16px; font-size: 15px;
      display: flex; align-items: center; gap: 6px; font-family: 'Nunito', sans-serif;
      font-weight: 900; border: 2px solid #00d4ff; box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
    }
    .btn-icon {
      background: #0088ff; border: 2px solid #ffffff; color: #fff;
      border-radius: 50%; width: 44px; height: 44px; display: flex;
      justify-content: center; align-items: center; font-size: 20px; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .btn-icon:active { transform: scale(0.92); }

    /* LOGO E IMPACTO VISUAL */
    .game-logo { font-size: 36px; text-align: center; line-height: 0.95; margin-top: 5px; }
    .logo-top { color: #ffffff; text-shadow: 0 5px 0 #002255, 0 10px 25px rgba(0, 136, 255, 0.8); display: block; letter-spacing: 2px; }
    .logo-bottom { color: #00d4ff; text-shadow: 0 5px 0 #004488, 0 10px 25px rgba(0, 212, 255, 0.8); display: block; font-size: 30px; letter-spacing: 3px; }

    /* PERSONAJE MASCOTA ANIMADA AZUL Y BLANCO */
    .hero-avatar-container {
      width: 170px; height: 170px; margin: 10px 0;
      filter: drop-shadow(0 10px 20px rgba(0, 212, 255, 0.5));
      animation: floatHero 2s infinite ease-in-out;
    }

    @keyframes floatHero {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    /* BOTONES */
    .btn-menu {
      width: 100%; max-width: 320px; padding: 18px; border-radius: 26px; border: 2px solid #ffffff;
      font-family: 'Fredoka One', cursive; font-size: 22px; color: #fff;
      cursor: pointer; background: linear-gradient(180deg, #0088ff, #0044cc);
      box-shadow: 0 8px 0 #002288, 0 12px 25px rgba(0,136,255,0.5);
      text-align: center; margin-bottom: 10px;
    }
    .btn-menu:active { transform: translateY(4px); }

    /* HUD EN JUEGO */
    .game-hud {
      width: 100%; max-width: 420px; padding: 10px 14px; display: flex;
      justify-content: space-between; align-items: center;
      background: rgba(0, 26, 64, 0.95); backdrop-filter: blur(12px);
      border-bottom-left-radius: 22px; border-bottom-right-radius: 22px;
      border: 2px solid #00d4ff; box-shadow: 0 8px 25px rgba(0, 136, 255, 0.4);
    }

    .speech-bubble {
      background: #ffffff; color: #001a40; padding: 10px 20px; border-radius: 18px;
      font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 14px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4); margin: 10px 0 5px; text-align: center;
      border: 2px solid #00d4ff; max-width: 90%;
    }

    /* TABLERO DE JUEGO */
    .board-container {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; align-items: center; width: 100%;
    }
    .grid-board {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px;
      background: rgba(0, 20, 50, 0.85); padding: 10px; border-radius: 24px;
      backdrop-filter: blur(10px); border: 3px solid #00d4ff;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 25px rgba(0,212,255,0.3);
    }
    .cell {
      width: 44px; height: 44px; background: rgba(255, 255, 255, 0.08);
      border-radius: 12px; display: flex; justify-content: center; align-items: center;
      cursor: pointer; transition: transform 0.15s, background-color 0.15s;
    }
    .cell.selected { transform: scale(1.18); background: rgba(0, 212, 255, 0.4); border: 2px solid #ffffff; }
    .cell.exploding { transform: scale(0); opacity: 0; transition: transform 0.25s, opacity 0.25s; }
    .cell svg { width: 38px; height: 38px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }

    /* BARRAS DE POTENCIADORES */
    .boosters-bar {
      display: flex; gap: 15px; margin: 10px 0 15px;
    }
    .booster-btn {
      background: #003380; border: 2px solid #00d4ff; border-radius: 18px;
      width: 55px; height: 55px; display: flex; justify-content: center;
      align-items: center; font-size: 22px; cursor: pointer; color: #fff;
      box-shadow: 0 6px 0 #001a40; transition: transform 0.1s;
    }
    .booster-btn:active { transform: translateY(3px); }

    /* TEXTO ANIMADO GOL */
    .goal-popup {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0);
      font-size: 48px; font-family: 'Fredoka One'; color: #00f0ff;
      text-shadow: 0 0 20px #00f0ff, 0 6px 0 #003380; pointer-events: none;
      z-index: 100; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.27);
    }
    .goal-popup.active { transform: translate(-50%, -50%) scale(1.3); }

    /* MODALES */
    .modal {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 13, 32, 0.92); backdrop-filter: blur(10px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 50;
    }
    .modal-card {
      background: #ffffff; padding: 30px 35px; border-radius: 30px;
      text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.6); max-width: 85%;
      border: 3px solid #0088ff; color: #001a40;
    }
    .modal-card h2 { margin: 0 0 10px; font-size: 28px; }
    .modal-card p { font-size: 15px; color: #475569; margin-bottom: 20px; font-weight: 800; font-family: 'Nunito'; }
  </style>
</head>
<body>

  <div class="goal-popup" id="goalPopup">¡GOOOL!</div>

  <!-- PORTADA DE INICIO CON PERSONAJE JUVENIL -->
  <div class="screen" id="mapScreen">
    <div class="top-navbar">
      <div class="hud-pill">❤️ <span id="livesCount">5</span></div>
      <div class="hud-pill">⭐ <span id="totalStars">0</span></div>
      <div class="btn-icon" onclick="openSettings()">⚙️</div>
    </div>

    <div class="game-logo">
      <span class="logo-top">BLUE STRIKE</span>
      <span class="logo-bottom">MATCH 3D SAGA ⚽</span>
    </div>

    <!-- PERSONAJE GUERRERO FUTBOLISTA AZUL Y BLANCO -->
    <div class="hero-avatar-container">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Cuerpo / Uniforme Azul y Blanco -->
        <path d="M60,110 L140,110 L130,170 L70,170 Z" fill="#0044cc" stroke="#ffffff" stroke-width="4"/>
        <rect x="85" y="110" width="30" height="60" fill="#ffffff"/>
        <!-- Cabeza y Cabello Cyberpunk Azul -->
        <circle cx="100" cy="70" r="38" fill="#ffdbac"/>
        <path d="M62,65 Q100,20 138,65 Q100,45 62,65 Z" fill="#00d4ff"/>
        <!-- Visor / Gafas Neón -->
        <rect x="75" y="60" width="50" height="18" rx="9" fill="#001a40" stroke="#00d4ff" stroke-width="3"/>
        <circle cx="88" cy="69" r="4" fill="#ffffff"/>
        <circle cx="112" cy="69" r="4" fill="#ffffff"/>
        <!-- Sonrisa -->
        <path d="M88,90 Q100,102 112,90" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
        <!-- Balón en el pie -->
        <circle cx="100" cy="175" r="18" fill="#ffffff" stroke="#001a40" stroke-width="3"/>
        <polygon points="100,165 108,172 105,182 95,182 92,172" fill="#0044cc"/>
      </svg>
    </div>

    <button class="btn-menu" id="startBtn">⚽ ¡INICIAR JUEGO!</button>
  </div>

  <!-- HUD EN JUEGO -->
  <div class="game-hud" id="hud" style="display: none;">
    <div class="hud-pill" style="border-color:#00d4ff;">🏆 <span id="lvlText">1</span></div>
    <div class="hud-pill">⭐ <span id="scoreText">0</span>/<span id="goalText">300</span></div>
    <div class="hud-pill" style="color:#0088ff;">🔄 <span id="movesText">20</span></div>
  </div>

  <!-- TABLERO PRINCIPAL -->
  <div class="board-container" id="gameBoard" style="display: none;">
    <div class="speech-bubble">¡Alinea 3 balones o gemas para marcar un Golazo!</div>
    <div class="grid-board" id="grid"></div>

    <div class="boosters-bar">
      <div class="booster-btn" onclick="useBooster('bomb')">🚀</div>
      <div class="booster-btn" onclick="useBooster('laser')">⚡</div>
      <div class="booster-btn" onclick="useBooster('shuffle')">🔀</div>
    </div>
  </div>

  <!-- MODAL DE VICTORIA -->
  <div class="modal" id="winModal" style="display: none;">
    <div class="modal-card">
      <h2 style="color: #0088ff;">🎉 ¡GOLAZO Y VICTORIA!</h2>
      <p>Has completado el nivel con éxito.</p>
      <button class="btn-menu" onclick="finishLevel(true)">SIGUIENTE NIVEL ➔</button>
    </div>
  </div>

  <!-- MODAL DE DERROTA -->
  <div class="modal" id="loseModal" style="display: none;">
    <div class="modal-card">
      <h2 style="color: #cc0044;">💥 FIN DEL PARTIDO</h2>
      <p>Se agotaron los movimientos.</p>
      <button class="btn-menu" style="background:#cc0044;" onclick="finishLevel(false)">REINTENTAR</button>
    </div>
  </div>

  <script>
    // FICHAS VECTORIALES 3D
    const ITEMS_3D = [
      `<svg viewBox="0 0 100 100"><defs><radialGradient id="g0" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#ffffff"/><stop offset="40%" stop-color="#0088ff"/><stop offset="100%" stop-color="#002266"/></radialGradient></defs><circle cx="50" cy="50" r="42" fill="url(#g0)" stroke="#ffffff" stroke-width="3"/><polygon points="50,25 65,35 60,52 40,52 35,35" fill="#ffffff" opacity="0.9"/></svg>`,
      `<svg viewBox="0 0 100 100"><defs><radialGradient id="g1" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#ffffff"/><stop offset="60%" stop-color="#e6f2ff"/><stop offset="100%" stop-color="#99ccff"/></radialGradient></defs><circle cx="50" cy="50" r="42" fill="url(#g1)" stroke="#0044aa" stroke-width="3"/><polygon points="50,20 62,45 90,48 68,66 75,93 50,78 25,93 32,66 10,48 38,45" fill="#0088ff"/></svg>`,
      `<svg viewBox="0 0 100 100"><defs><radialGradient id="g2" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#ffffff"/><stop offset="50%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#005588"/></radialGradient></defs><rect x="18" y="18" width="64" height="64" rx="16" fill="url(#g2)" stroke="#ffffff" stroke-width="3"/><rect x="28" y="28" width="20" height="20" rx="6" fill="#ffffff" opacity="0.6"/></svg>`,
      `<svg viewBox="0 0 100 100"><defs><radialGradient id="g3" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#80c8ff"/><stop offset="50%" stop-color="#003380"/><stop offset="100%" stop-color="#000d26"/></radialGradient></defs><path d="M50 10 L85 25 L85 60 C85 80, 50 95, 50 95 C50 95, 15 80, 15 60 L15 25 Z" fill="url(#g3)" stroke="#00d4ff" stroke-width="3"/><circle cx="50" cy="50" r="14" fill="#ffffff"/></svg>`
    ];

    const ROWS = 7, COLS = 7;
    let board = [];
    let selectedCell = null;
    let currentLevel = 1;
    let score = 0, goalScore = 300, moves = 20;
    let isProcessing = false;

    // BOTÓN DE INICIO DIRECTO
    document.getElementById('startBtn').addEventListener('click', () => {
      startLevel(currentLevel);
    });

    function startLevel(lvlNum) {
      currentLevel = lvlNum;
      score = 0; moves = 20; goalScore = 250 + (lvlNum * 80);
      isProcessing = false; selectedCell = null;

      document.getElementById('mapScreen').style.display = 'none';
      document.getElementById('hud').style.display = 'flex';
      document.getElementById('gameBoard').style.display = 'flex';

      document.getElementById('lvlText').innerText = currentLevel;
      document.getElementById('goalText').innerText = goalScore;
      document.getElementById('movesText').innerText = moves;

      initBoard();
    }

    function initBoard() {
      do {
        board = [];
        for (let r = 0; r < ROWS; r++) {
          board[r] = [];
          for (let c = 0; c < COLS; c++) {
            board[r][c] = Math.floor(Math.random() * ITEMS_3D.length);
          }
        }
      } while (findMatches().length > 0);

      renderBoard();
    }

    function renderBoard() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.r = r; cell.dataset.c = c;
          if (selectedCell && selectedCell.r === r && selectedCell.c === c) cell.classList.add('selected');
          if (board[r][c] !== null) cell.innerHTML = ITEMS_3D[board[r][c]];
          cell.onclick = () => onCellClick(r, c);
          grid.appendChild(cell);
        }
      }
    }

    async function onCellClick(r, c) {
      if (isProcessing) return;

      if (!selectedCell) {
        selectedCell = { r, c }; renderBoard();
      } else {
        const isAdjacent = Math.abs(selectedCell.r - r) + Math.abs(selectedCell.c - c) === 1;
        if (isAdjacent) {
          isProcessing = true;
          swap(selectedCell.r, selectedCell.c, r, c);
          renderBoard();

          let matches = findMatches();
          if (matches.length > 0) {
            moves--; updateHUD();
            await processCascades();
          } else {
            swap(selectedCell.r, selectedCell.c, r, c);
            renderBoard();
          }
          selectedCell = null; isProcessing = false;
        } else {
          selectedCell = { r, c }; renderBoard();
        }
      }
    }

    function swap(r1, c1, r2, c2) {
      let temp = board[r1][c1]; board[r1][c1] = board[r2][c2]; board[r2][c2] = temp;
    }

    function findMatches() {
      let matched = new Set();
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS - 2; c++) {
          let val = board[r][c];
          if (val !== null && val === board[r][c+1] && val === board[r][c+2]) {
            matched.add(`${r},${c}`); matched.add(`${r},${c+1}`); matched.add(`${r},${c+2}`);
          }
        }
      }
      for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS - 2; r++) {
          let val = board[r][c];
          if (val !== null && val === board[r+1][c] && val === board[r+2][c]) {
            matched.add(`${r},${c}`); matched.add(`${r+1},${c}`); matched.add(`${r+2},${c}`);
          }
        }
      }
      return Array.from(matched).map(coord => {
        let [r, c] = coord.split(',').map(Number);
        return { r, c };
      });
    }

    async function processCascades() {
      let matches = findMatches();
      while (matches.length > 0) {
        score += matches.length * 20;
        updateHUD();

        matches.forEach(({ r, c }) => {
          board[r][c] = null;
          const cell = document.querySelector(`[data-r="${r}"][data-c="${c}"]`);
          if (cell) cell.classList.add('exploding');
        });

        await new Promise(res => setTimeout(res, 220));

        // Gravedad
        for (let c = 0; c < COLS; c++) {
          let emptyRow = ROWS - 1;
          for (let r = ROWS - 1; r >= 0; r--) {
            if (board[r][c] !== null) {
              board[emptyRow][c] = board[r][c];
              if (emptyRow !== r) board[r][c] = null;
              emptyRow--;
            }
          }
          for (let r = emptyRow; r >= 0; r--) {
            board[r][c] = Math.floor(Math.random() * ITEMS_3D.length);
          }
        }

        renderBoard();
        await new Promise(res => setTimeout(res, 180));
        matches = findMatches();
      }

      if (score >= goalScore) {
        setTimeout(() => document.getElementById('winModal').style.display = 'flex', 300);
      } else if (moves <= 0) {
        setTimeout(() => document.getElementById('loseModal').style.display = 'flex', 300);
      }
    }

    function useBooster(type) {
      if (isProcessing) return;
      isProcessing = true;
      if (type === 'shuffle') { initBoard(); }
      else if (type === 'bomb') {
        for(let r=2; r<5; r++) for(let c=2; c<5; c++) board[r][c] = null;
        processCascades();
      } else if (type === 'laser') {
        for(let c=0; c<COLS; c++) board[3][c] = null;
        processCascades();
      }
      isProcessing = false;
    }

    function updateHUD() {
      document.getElementById('scoreText').innerText = score;
      document.getElementById('movesText').innerText = moves;
    }

    function finishLevel(win) {
      document.getElementById('winModal').style.display = 'none';
      document.getElementById('loseModal').style.display = 'none';
      document.getElementById('hud').style.display = 'none';
      document.getElementById('gameBoard').style.display = 'none';
      document.getElementById('mapScreen').style.display = 'flex';

      if (win) { currentLevel++; }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
